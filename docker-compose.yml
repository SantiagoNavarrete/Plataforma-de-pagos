services:
  postgres:
    image: postgres:16-alpine
    container_name: boleta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: boleta
      POSTGRES_USER: boleta
      POSTGRES_PASSWORD: boleta_local
    ports:
      - "5432:5432"
    volumes:
      - boleta-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boleta -d boleta"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  boleta-postgres-data:
